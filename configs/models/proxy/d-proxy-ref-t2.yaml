# Proxy preset (experiment config, not a release name). d-proxy-ref-t1 with the t2 (32K) vocabulary; isolates the tokenizer.
name: HAMIC-D-proxy-ref-t2
architecture: llama
label_parameters: 1.2e8
label_tolerance: 0.1
num_layers: 16
hidden_size: 768
num_heads: 12
num_kv_heads: 4
head_dim: 64
intermediate_size: 2048
vocab_size: 32000
max_position_embeddings: 2048
rope_theta: 500000.0
norm_eps: 1.0e-06
