# Corpus pipeline configuration. Every corpus manifest records these values and their
# hash. Thresholds are provisional until the human audit of kept and rejected samples.
version: 1
name: v0.13

normalization:
  unicode_form: NFC
  unescape_html: true
  strip_zero_width: true
  collapse_whitespace: true

pii_filter: true

# Calibrated for Vietnamese: the mean syllable is ~3 characters, so English rules such
# as "mean word length 3-10" would reject normal sentences.
quality:
  min_chars: 200
  min_letter_ratio: 0.6
  min_mean_syllable_chars: 1.5
  max_mean_syllable_chars: 8.0
  max_duplicate_line_ratio: 0.3
  # v0.13: PDFs set in pre-Unicode Vietnamese fonts (VNI, TCVN3) extract as mojibake;
  # 2.9% of FinePDFs vie_Latn documents have more than 5% such syllables.
  max_legacy_font_share: 0.05

near_dedup:
  threshold: 0.8
  num_perm: 128
  shingle_size: 5

split:
  validation: 0.01
  test: 0.01
  seed: hamic-split-v1

shard_docs: 50000

# v0.13: drop documents that copy downstream benchmark text. A document is dropped when
# it equals a dev/test text or contains at least half of the 13-grams of one; a single
# shared 13-gram is not enough (the national motto heading every administrative document
# also occurs in benchmark comments). Rows of grouped social sources are checked before
# grouping against every split, exact match or any shared 8-gram (the ViSoBERT corpus
# contains ViHSD/VSMEC comments verbatim). The file is written by
# `hamic corpus benchmark-texts` (all splits of all nine tasks).
contamination:
  benchmarks: data/work/contamination/benchmarks-v1.jsonl.gz
  sha256: a5f220b89ccc39e874391bfab8c8183e29cad62c8a0ea5bada279bf1598c24db
  ngram: 13
  splits: [dev, test]
  min_coverage: 0.5
