# E100M learning-rate sweep (5.0e-4). Recipe chosen by the E-proxy v0.2 round:
# final (WSD, document attention, Wikipedia x2) + E6b PMI masking. The winning rate
# goes into the E100M pilot (~6.5B tokens on corpus v0.4).
version: 1
run_id: e100m-sweep-lr5e-4
model_preset: configs/models/hamic-e100m-m.yaml   # 18 x 640, 102.8M parameters
tokenized: data/tokenized/v0.3/t1-bbpe-20544
objective: mlm
mask_rate: 0.30
seq_len: 512
micro_batch_size: 128
grad_accum_steps: 4          # 262,144 tokens per optimizer step
total_tokens: 5.0e8          # short sweep run, same length as the proxy round
learning_rate: 5.0e-4
warmup_ratio: 0.06
min_lr_ratio: 0.1
betas: [0.9, 0.98]
weight_decay: 0.01
grad_clip: 1.0
precision: bf16
seed: 1234
device: auto
compile: true                # operational
sparse_prediction: true      # operational: same loss, MLM head on labelled positions only
lr_schedule: wsd             # E1
decay_ratio: 0.2
cross_document_attention: false   # E2
source_weights:              # E3
  wikipedia-vi-20231101: 2.0
masking: pmi                 # E6b: PMI collocations masked whole half of the time
pmi_unit_share: 0.5
log_every_steps: 10
eval_every_steps: 250
eval_sequences: 2048
eval_mask_rate: 0.15
checkpoint_every_minutes: 30
