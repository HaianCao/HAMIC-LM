# HAMIC-ES canonical pretraining on cumulative corpus v0.5.
# v0.5 contains 23,596,594,203 train tokens; 20B is ~0.85 corpus epoch and
# increases the legacy E100M pilot budget from 7.5B to 20B tokens.
version: 1
run_id: hamic-es-v05
model_preset: configs/models/hamic-es.yaml   # 24 x 768, ~150.9M parameters
tokenized: data/tokenized/v0.5/t1-bbpe-20544
objective: mlm
mask_rate: 0.30
seq_len: 512
micro_batch_size: 128
grad_accum_steps: 4          # 262,144 tokens per optimizer step
total_tokens: 2.0e10         # ~76,294 optimizer steps
learning_rate: 8.0e-4
warmup_ratio: 0.03           # ~2,289 steps
min_lr_ratio: 0.1
betas: [0.9, 0.98]
weight_decay: 0.01
grad_clip: 1.0
precision: bf16
seed: 1234
device: auto
compile: true
sparse_prediction: true
attention: flex_attention
lr_schedule: wsd
decay_ratio: 0.2
cross_document_attention: false
source_weights:
  wikipedia-vi-20231101: 2.0
masking: pmi
pmi_unit_share: 0.5
log_every_steps: 10
eval_every_steps: 1000
eval_sequences: 2048
eval_mask_rate: 0.15
checkpoint_every_minutes: 30

