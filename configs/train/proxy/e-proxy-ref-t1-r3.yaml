# E-proxy, reference (RoBERTa), t1, MLM 15%. Architecture arm vs e-proxy-m-t1.
# Third attempt: RoBERTa (post-LN) collapses to the unigram loss (~7.4) at the shared
# lr 8e-4 with this warmup (runs e-proxy-ref-t1 and -r2), so this arm uses lr 4e-4,
# the best of three 300-step tests (4e-4; 8e-4 with warmup 0.25; 2e-4).
version: 1
run_id: e-proxy-ref-t1-r3
model_preset: configs/models/proxy/e-proxy-ref-t1.yaml
tokenized: data/tokenized/pilot-v0.1/t1-bbpe-20544
objective: mlm
mask_rate: 0.15
seq_len: 512
micro_batch_size: 128
grad_accum_steps: 4          # 262,144 tokens per optimizer step
total_tokens: 5.0e8
learning_rate: 4.0e-4        # RoBERTa only; the ModernBERT arms train at 8e-4
warmup_ratio: 0.06
min_lr_ratio: 0.1
betas: [0.9, 0.98]
weight_decay: 0.01
grad_clip: 1.0
precision: bf16
seed: 1234
device: auto
compile: true                # fused kernels; operational, not part of the run identity
log_every_steps: 10
eval_every_steps: 250
eval_sequences: 2048
eval_mask_rate: 0.15        # same validation masking in every E-proxy arm
checkpoint_every_minutes: 30
