# E-proxy, modern, t1, MLM 30%. Mask-rate arm vs e-proxy-m-t1; training loss is not
# comparable across mask rates, so validation masks at 15% for both arms (eval_mask_rate).
version: 1
run_id: e-proxy-m-t1-mlm30
model_preset: configs/models/proxy/e-proxy-m-t1.yaml
tokenized: data/tokenized/pilot-v0.1/t1-bbpe-20544
objective: mlm
mask_rate: 0.30
seq_len: 512
micro_batch_size: 128
grad_accum_steps: 4          # 262,144 tokens per optimizer step
total_tokens: 5.0e8
learning_rate: 8.0e-4        # shared by every E-proxy run; not tuned per arm
warmup_ratio: 0.06
min_lr_ratio: 0.1
betas: [0.9, 0.98]
weight_decay: 0.01
grad_clip: 1.0
precision: bf16
seed: 1234
device: auto
log_every_steps: 10
eval_every_steps: 250
eval_sequences: 2048
eval_mask_rate: 0.15        # same validation masking in every E-proxy arm
checkpoint_every_minutes: 30
