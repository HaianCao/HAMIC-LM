# D-proxy, reference, t2 (32K). Budget is byte-matched to d-proxy-ref-t1 (t2 needs 1.36%
# fewer tokens for the same text), so both arms see the same text; compare on eval_bpb,
# not eval_loss.
version: 1
run_id: d-proxy-ref-t2
model_preset: configs/models/proxy/d-proxy-ref-t2.yaml
tokenized: data/tokenized/pilot-v0.1/t2-bbpe-32k
objective: clm
seq_len: 1024
micro_batch_size: 64
grad_accum_steps: 8          # 524,288 tokens per optimizer step
total_tokens: 986448838
learning_rate: 1.5e-3        # shared by every D-proxy run; not tuned per arm
warmup_ratio: 0.02
min_lr_ratio: 0.1
betas: [0.9, 0.95]
weight_decay: 0.1
grad_clip: 1.0
precision: bf16
seed: 1234
device: auto
log_every_steps: 10
eval_every_steps: 250
eval_sequences: 1024         # ~1M validation tokens, fixed across evaluations
checkpoint_every_minutes: 30
