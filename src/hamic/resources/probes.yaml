# Natural sentences from which the `no_diacritics` and `teencode` categories are derived
# automatically (see hamic.tokenization.probes).
base_sentences:
  - Hôm nay tôi không biết phải làm gì cả.
  - Bạn có muốn đi ăn phở với mình không?
  - Cảm ơn mọi người đã giúp đỡ em rất nhiều.
  - Sinh viên năm nhất cần đăng ký học phần trước thứ hai.
  - Thời tiết Hà Nội hôm nay khá lạnh và có mưa phùn.
  - Em yêu anh nhiều lắm, đừng giận em nữa nhé.
  - Giá vàng hôm nay tăng mạnh so với tuần trước.
  - Bây giờ mình đang ở nhà, tối nay gọi điện thoại sau nhé.
  - Không có gì đâu, chuyện bình thường thôi mà.
  - Tại sao bạn lại trả lời tin nhắn chậm như vậy?
  - Học sinh tiểu học được nghỉ hè từ đầu tháng sáu.
  - Mọi người trong gia đình đều khỏe mạnh và vui vẻ.
  - Quán cà phê này dễ thương quá, lần sau mình quay lại.
  - Chúc cả nhà ngủ ngon và có một ngày mai thật tốt đẹp.
  - Giáo viên chủ nhiệm đã gửi thông báo cho phụ huynh.
  - Xin lỗi vì đã đến muộn, đường hôm nay tắc quá.
  - Anh ấy làm việc ở một công ty phần mềm tại Đà Nẵng.
  - Món này phải nấu như thế nào thì mới ngon?
  - Đúng rồi, chúng ta nên bắt đầu từ những việc nhỏ.
  - Ngày mai lớp mình được nghỉ, vui quá đi thôi.
