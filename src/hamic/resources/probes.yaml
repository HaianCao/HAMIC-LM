# Probe strings for the tokenizer acceptance suite. Each category targets a known way
# tokenizers mis-split Vietnamese. Results are reported per category, so keep categories
# balanced and add items rather than rewrite them (bump `version` on any change).
version: 1

# Person names are generated as surname + middle + given combinations (common name parts,
# not real individuals), plus a few historical figures.
person_name_parts:
  surnames: [Nguyễn, Trần, Lê, Phạm, Hoàng, Huỳnh, Phan, Vũ, Võ, Đặng, Bùi, Đỗ, Hồ, Ngô, Dương, Lý]
  middle: [Văn, Thị, Đức, Minh, Ngọc, Thanh, Hữu, Quốc, Thu, Gia]
  given: [An, Bình, Châu, Dũng, Giang, Hạnh, Khánh, Linh, Nhung, Phương, Quân, Thảo, Trung, Tuấn, Yến, Hiếu, Khoa, Trâm, Vy, Huy]
