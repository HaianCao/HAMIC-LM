# Look-alike characters folded by tokenizers with `fold_confusables: true`.
#
# - always: replaced everywhere (no legitimate use in Vietnamese text).
# - latin_context: replaced only next to a Latin letter, so obfuscated Vietnamese such as
#   "пgười ѕẽ nàу củα кʜôɴɢ" becomes "người sẽ này của không" while genuine Russian or Greek
#   words ("Москва", "α-helix") stay unchanged.
#
# Counts (20/11/2026, 449M characters of the v0.12 tokenizer sample): 72,408 word
# occurrences mix Latin with Cyrillic/Greek letters; the most frequent intruders are
# п 15,818, ᴄ 12,671, Һ 6,853, ɴ 6,720, у 6,034, т 5,508, ᴠ 4,999, ι 4,784, ѕ 4,781,
# υ 4,557, α 4,115. Mappings follow visual similarity (Unicode TR39 confusables where it
# lists one; small capitals map to the lowercase letter they imitate).
version: 2
always:
  "Ð": "Đ"        # Icelandic eth left by encoding converters
  "ð": "đ"
  "´": "'"        # spacing acute used as an apostrophe (NFKC would leave a stray mark)
  "˜": "~"        # spacing small tilde (same reason)
  "️": ""    # emoji variation selectors: presentation only
  "︎": ""
latin_context:
  # Cyrillic
  "а": "a"
  "е": "e"
  "о": "o"
  "р": "p"
  "с": "c"
