  ]
  modifiers: ["🏻", "🏼", "🏽", "🏾", "🏿", "♀", "♂"]
  emoticons: [
    ":)", ":))", ":)))", ":(", ":((", ":(((", "=))", "=)))", "=((", ";)", ":'(", "^^",
    "^_^", "-_-", ":-)", ":-(", "@@", "..",
  ]
  symbols: [
    "₫", "€", "£", "¥", "°", "±", "×", "÷", "≈", "≠", "≤", "≥", "∞", "√", "π", "μ",
    "Ω", "α", "β", "γ", "Δ", "λ", "σ", "→", "←", "↑", "↓", "⇒", "⇔", "►", "▶", "●",
    "■", "▪", "•", "–", "—", "“", "”", "‘", "’", "«", "»", "©", "®", "§", "【", "】",
    "。",
